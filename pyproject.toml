[project]
name = "kaushal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vipin singh", email = "vipendrarajpoot2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipynb>=0.5.1",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-community>=0.4.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.15",
    "langsmith>=0.14.11",
    "python-dotenv>=1.2.4",
]

[project.scripts]
kaushal = "kaushal:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
